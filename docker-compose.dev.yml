version: "3.9"

networks:
  internal-net:
    driver: bridge
  public-net:
    driver: bridge

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: jarvis_backend
    ports:
      - "8990:8989"
    volumes:
      - ./backend:/app
      - /app/node_modules
    mem_limit: 520m
    mem_reservation: 400m
    environment:
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - NODE_OPTIONS=--max-old-space-size=400
    depends_on:
      - redis
      - rabbitmq
    networks:
      - internal-net
      - public-net

  worker-export-data:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: jarvis_worker_export_data
    volumes:
      - ./backend:/usr/src/app
      - ./backend/node_modules:/usr/src/app/node_modules
    mem_limit: 600m
    mem_reservation: 400m
    working_dir: /usr/src/app
    command: nodemon app/workers/export-data-jarvis/index.js
    environment:
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - NODE_OPTIONS=--max-old-space-size=400
    depends_on:
      - redis
      - rabbitmq
    networks:
      - internal-net

  task-trigger-schedule-job:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: jarvis_task_trigger_schedule_job
    volumes:
      - ./backend:/usr/src/app
      - ./backend/node_modules:/usr/src/app/node_modules
    mem_limit: 800m
    mem_reservation: 600m
    working_dir: /usr/src/app
    command: nodemon app/tasks/trigger-scheduled-jobs/index.js
    environment:
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - NODE_OPTIONS=--max-old-space-size=600
    depends_on:
      - redis
      - rabbitmq
    networks:
      - internal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: jarvis_frontend
    ports:
      - "8083:8081"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - public-net

  redis:
    image: redis:6
    container_name: jarvis_redis
    restart: unless-stopped
    networks:
      - internal-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: jarvis_rabbitmq
    ports:
      - "15673:15672"
    restart: unless-stopped
    networks:
      - internal-net
